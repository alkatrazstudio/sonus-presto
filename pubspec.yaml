name: sonuspresto
description: >
  A bare-bones music player.
  Intended to utilize a filesystem to browse your music instead of automatically grouping by artist, album or genre.
  Focused on gesture controls.
  Supports CUE sheets, M3U playlists and Internet radio.

version: 0.5.2+17

environment:
  sdk: ^3.7.2
  flutter: ^3.29.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  just_audio: 0.10.5
  audio_service: 0.18.18
  audio_session: 0.2.2
  shared_preferences: 2.5.3
  flex_color_scheme: 8.4.0
  provider: 6.1.5+1
  scrollable_positioned_list: 0.3.8
  super_tooltip: 2.1.0
  collection: any
  path: any

  help_page:
    git:
      url: https://github.com/z80maniac/flutter_help_page.git
      ref: c6e76a5b30a33cce197f80643fbb5f44551ee86a

dev_dependencies:
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  generate: true

publish_to: "none"
